name: Update currently reading

on:
  schedule:
    - cron: "17 9 * * *"   # once a day
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_reading.py
      - name: Commit if the list changed
        run: |
          if git diff --quiet js/reading.js; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update currently reading from Goodreads"
          git push
